apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'kotlin-kapt'

kotlin {
    jvmToolchain {
        languageVersion.set(JavaLanguageVersion.of(11))
    }
}

android {
    namespace 'com.healbe.complex_example'

    compileSdk 34

    defaultConfig {
        minSdk 29
        targetSdk 34

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        debug {
            minifyEnabled false
        }

        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = 11
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    api(project(":common"))

    implementation("androidx.appcompat:appcompat:1.5.1")
    implementation("androidx.core:core-ktx:1.13.1")
    implementation("androidx.activity:activity-ktx:1.5.1")
    implementation("androidx.fragment:fragment-ktx:1.5.3")
    implementation("androidx.cardview:cardview:1.0.0")
    implementation("androidx.constraintlayout:constraintlayout:2.1.4")
    implementation "androidx.recyclerview:recyclerview:1.3.2"
    implementation("com.google.android.material:material:1.12.0")
//    kapt("androidx.annotation:annotation:1.8.0")

    // Logging
    api("com.jakewharton.timber:timber:5.0.1")

    // HEALBE SDK
//    implementation("com.healbe:healbesdk:1.5.0")
//    api(files("libs/healbesdk-1.5.0.aar"))


    // rxJava
    api("io.reactivex.rxjava2:rxjava:2.2.21")
    api("io.reactivex.rxjava2:rxandroid:2.1.1")

    implementation("org.jetbrains.kotlinx:kotlinx-coroutines-core:1.5.2")

    // Kotlin Coroutines Rx2 Integration
    implementation("org.jetbrains.kotlinx:kotlinx-coroutines-rx2:1.5.2")
    implementation libs.healbesdk
}